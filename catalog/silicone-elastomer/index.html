<script>
/* 扉页：按站点根相对路径读取各节完成态，渲染卡片勾选 */
(function () {
  function render() {
    var cards = document.querySelectorAll('.lesson-card[data-key]');
    cards.forEach(function (card) {
      var done = window.LearnSite.isDone(card.getAttribute('data-key'));
      card.classList.toggle('is-done', done);
      var box = card.querySelector('.lesson-check');
      if (box) box.checked = done;
    });
  }
  if (window.LearnSite) render();
})();
</script>
