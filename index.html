    'catalog/surfactants/basics.html',
    'catalog/surfactants/amphoteric.html',
    'catalog/surfactants/anionic.html',
    'catalog/surfactants/cationic-nonionic.html',
    'catalog/surfactants/apg.html',
    'catalog/surfactants/synthesis.html',
    'catalog/surfactants/testing.html',
    'catalog/surfactants/cab-family.html',
    'catalog/surfactants/cab-35.html',
    'catalog/surfactants/lab-35tf.html',
    'catalog/surfactants/mab-40ldl.html',
    'catalog/carbomer/carbomer-family.html',
    'catalog/carbomer/carbomer-theory.html',
    'catalog/carbomer/carbomer-application.html',
    'catalog/carbomer/carbomer-competitors.html',
    'catalog/carbomer/carbomer-380.html',
    'catalog/carbomer/carbomer-640.html',
    'catalog/carbomer/carbomer-fd21.html',
    'catalog/suspension-rheology/theory.html',
    'catalog/suspension-rheology/competitors.html',
    'catalog/functional-polymer/theory.html',
    'catalog/functional-polymer/competitors.html',
    'catalog/emulsifier/theory.html',
    'catalog/emulsifier/competitors.html',
    'catalog/sunscreen/theory.html',
    'catalog/sunscreen/competitors.html',
    'catalog/cationic-conditioner/theory.html',
    'catalog/cationic-conditioner/competitors.html',
    'catalog/anti-dandruff/theory.html',
    'catalog/anti-dandruff/competitors.html',
    'catalog/anti-dandruff/shd.html',
    'catalog/silicone-oil/theory.html',
    'catalog/silicone-oil/competitors.html',
    'catalog/silicone-wax/theory.html',
    'catalog/silicone-wax/competitors.html',
    'catalog/silicone-elastomer/theory.html',
    'catalog/silicone-elastomer/application.html',
    'catalog/amino-acid/theory.html',
    'catalog/amino-acid/competitors.html',
    'catalog/natural-oil/theory.html',
    'catalog/natural-oil/competitors.html',
    'catalog/chelating/theory.html',
    'catalog/chelating/competitors.html',
    'catalog/home-care/theory.html',
    'catalog/home-care/competitors.html',
    'catalog/formulation/index.html'
  ];

  function render() {
    var done = 0;
    SECTIONS.forEach(function (p) { if (window.LearnSite.isDone(p)) done++; });

    var ring = document.getElementById('ringFg');
    var R = 42;
    var C = 2 * Math.PI * R;
    ring.style.strokeDasharray = String(C);
    ring.style.strokeDashoffset = String(C * (1 - done / SECTIONS.length));
    document.getElementById('ringNum').textContent = done + '/' + SECTIONS.length;

    var last = window.LearnSite.lastVisit();
    if (last) {
      document.getElementById('continueTitle').textContent = last.title;
      document.getElementById('continueText').hidden = true;
      document.getElementById('continueMeta').hidden = false;
      document.getElementById('doneNum').textContent = String(done);
      document.getElementById('lastName').textContent = last.title;
      document.getElementById('miniBar').hidden = false;
      document.getElementById('miniBarFill').style.width =
        Math.round(done / SECTIONS.length * 100) + '%';
      document.getElementById('continueBtn').href = last.path;
      document.getElementById('continueBtnText').textContent = '继续学习这一节';
    }
  }

  // 部署版等正文解密完成再渲染进度（本地明文站立即渲染，行为不变）
  function boot() {
    if (window.LearnSite) render();
    window.addEventListener('storage', function () { if (window.LearnSite) render(); });
  }
  if (window.__secureReady && typeof window.__secureReady.then === 'function') {
    window.__secureReady.then(boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
