  function render() {
    var done = 0;
    SECTIONS.forEach(function (p) { if (window.LearnSite.isDone(p)) done++; });

    var ring = document.getElementById('ringFg');
    var R = 42;
    var C = 2 * Math.PI * R;
    ring.style.strokeDasharray = String(C);
    ring.style.strokeDashoffset = String(C * (1 - done / SECTIONS.length));
    document.getElementById('ringNum').textContent = done + '/' + SECTIONS.length;

    var last = window.LearnSite.lastVisit();
    if (last) {
      document.getElementById('continueTitle').textContent = last.title;
      document.getElementById('continueText').hidden = true;
      document.getElementById('continueMeta').hidden = false;
      document.getElementById('doneNum').textContent = String(done);
      document.getElementById('lastName').textContent = last.title;
      document.getElementById('miniBar').hidden = false;
      document.getElementById('miniBarFill').style.width =
        Math.round(done / SECTIONS.length * 100) + '%';
      document.getElementById('continueBtn').href = last.path;
      document.getElementById('continueBtnText').textContent = '继续学习这一节';
    }
  }

  // 部署版等正文解密完成再渲染进度（本地明文站立即渲染，行为不变）
  function boot() {
    if (window.LearnSite) render();
    window.addEventListener('storage', function () { if (window.LearnSite) render(); });
  }
  if (window.__secureReady && typeof window.__secureReady.then === 'function') {
    window.__secureReady.then(boot);
  } else {
    boot();
  }
